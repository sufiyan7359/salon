server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Angular client-side routing: fall back to index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API - proxied to the NestJS backend service.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO - needs the Upgrade/Connection headers for the websocket handshake.
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker / manifest should never be aggressively cached.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
