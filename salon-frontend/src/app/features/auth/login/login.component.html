<div class="login-card" @fadeIn>
  <div class="login-card__brand">
    <span class="login-card__mark">G</span>
    <span>Glow Salon</span>
  </div>
  <h1>{{ mode() === 'login' ? 'Owner Sign In' : 'Set Up Your Salon Account' }}</h1>
  <p class="login-card__subtitle">
    {{ mode() === 'login' ? 'Manage your queue, services and staff.' : 'One-time setup for this salon\'s owner account.' }}
  </p>

  <form (ngSubmit)="submit()">
    @if (mode() === 'register') {
      <div class="form-field">
        <label for="name">Your name</label>
        <input
          id="name"
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
          required
        />
      </div>
    }

    <div class="form-field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        required
      />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        required
      />
    </div>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
      {{ submitting() ? 'Please wait...' : mode() === 'login' ? 'Sign In' : 'Create Account' }}
    </button>
  </form>

  <button type="button" class="login-card__toggle" (click)="toggleMode()">
    {{ mode() === 'login' ? "First time here? Set up your salon" : 'Already have an account? Sign in' }}
  </button>
</div>
